version: "3.9"
services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    enviroment:
      -KAGGLE_USERNAME=${KAGGLE_USERNAME}
      -KAGGLE_KEY=${KAGGLE_KEY}
    volumes:
      - ./data:/app/data
      - ./feedback.db:/app/feedback.db
    command: >
      sh -c "./scripts/download_data.sh &&
      python -m src.ingest &&
      streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
  dashboard:
    build: .
    ports:
      - "8502:8502"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./feedback.db:/app/feedback.db
    command: streamlit run monitoring_dashboard.py --server.port=8502 --server.address=0.0.0.0

